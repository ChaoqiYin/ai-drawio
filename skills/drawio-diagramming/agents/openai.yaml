interface:
  display_name: "Draw.io Diagramming"
  short_description: "Draw.io XML drawing patterns and layout guidance"
  default_prompt: "Use $drawio-diagramming to design or repair draw.io diagrams and mxGraph XML with clean layout and valid structure. Default to non-overlapping ordinary shapes, keep connectors off shape areas, treat containers as exceptions for child layout, and minimize connector crossings. For dense diagrams, plan connector channels first and use explicit waypoints for critical edges instead of relying on automatic orthogonal routing. If the user wants the result applied in live draw.io, also use `$ai-drawio-cli` and do not stop at generating a `.drawio` file."
